<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Selector Healer</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <!-- Toolbar -->
  <header class="toolbar">
    <div class="toolbar-left">
      <span class="logo">⛨</span>
      <span class="title">Selector Healer</span>
      <span id="ws-status" class="status-badge disconnected">Disconnected</span>
    </div>
    <div class="toolbar-right">
      <input id="ws-url" type="text" value="ws://localhost:7400" spellcheck="false">
      <button id="btn-connect" title="Connect">Connect</button>
      <button id="btn-evaluate" title="Evaluate all selectors" disabled>Evaluate</button>
    </div>
  </header>

  <!-- Summary bar -->
  <div id="summary" class="summary">
    <span class="summary-item">No selectors loaded</span>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <select id="filter-status">
      <option value="all">All</option>
      <option value="ok">OK</option>
      <option value="broken">Broken</option>
      <option value="multiple-matches">Multiple</option>
      <option value="pending">Pending</option>
    </select>
    <input id="filter-search" type="text" placeholder="Search selectors...">
  </div>

  <!-- Selector table -->
  <div id="selector-list" class="selector-list">
    <div class="empty-state">
      <p>No selectors loaded.</p>
      <p>Start the CLI server:</p>
      <code>selector-healer serve</code>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
