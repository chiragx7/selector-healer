<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Selector Healer</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <span class="logo">🛡️</span>
      <span class="title">Selector Healer</span>
      <span id="ws-status" class="status-badge disconnected">Disconnected</span>
    </div>
    <div class="toolbar-right">
      <input id="ws-url" type="text" value="ws://localhost:7400" spellcheck="false">
      <button id="btn-connect" title="Connect to the CLI server">Connect</button>
      <button id="btn-evaluate" class="primary" title="Evaluate all selectors against this page" disabled>Evaluate</button>
    </div>
  </header>

  <div class="filter-bar">
    <input id="filter-search" type="text" placeholder="Search selectors…">
  </div>

  <div id="app">
    <div class="empty">Loading…</div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
