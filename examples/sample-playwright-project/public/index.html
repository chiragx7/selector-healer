<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; }
    .card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.1); width: 360px; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    button { width: 100%; padding: 0.7rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #1d4ed8; }
    .error-banner { padding: 0.6rem; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; border-radius: 6px; margin-bottom: 1rem; display: none; }
    .error-banner.visible { display: block; }
    .footer { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #666; }
    .footer a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>

    <div class="error-banner" role="alert"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" data-testid="email-input" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" data-testid="password-input" placeholder="Enter password" required>
      </div>
      <button type="submit" id="submit" role="button" data-testid="submit-btn">Sign in</button>
    </form>

    <div class="footer">
      Don't have an account? <a href="/signup">Sign up</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value;
      var password = document.getElementById('password').value;
      var banner = document.querySelector('.error-banner');

      if (email === 'user@example.com' && password === 'password123') {
        window.location.href = '/dashboard';
      } else {
        banner.textContent = 'Invalid email or password';
        banner.classList.add('visible');
      }
    });
  </script>
</body>
</html>
