<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; }
    .nav { background: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .nav h2 { font-size: 1.1rem; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.85rem; }
    .content { padding: 2rem; max-width: 600px; margin: 0 auto; }
    .greeting { font-size: 1.3rem; margin-bottom: 1rem; }
    .card { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  </style>
</head>
<body>
  <nav class="nav">
    <h2>Selector Healer Demo</h2>
    <div class="user-avatar" data-testid="avatar">U</div>
  </nav>

  <div class="content">
    <div class="greeting" data-testid="dashboard-greeting">Welcome, user@example.com</div>
    <div class="card">
      <p>This is the dashboard. You're logged in.</p>
    </div>
  </div>
</body>
</html>
