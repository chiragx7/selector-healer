<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1f2937; }
    .nav { background: #fff; padding: 1rem 2rem; display: flex; align-items: center; gap: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .nav .brand { font-size: 1.1rem; font-weight: 700; margin-right: auto; }
    .nav a { color: #2563eb; text-decoration: none; font-size: 0.95rem; }
    .nav a:hover { text-decoration: underline; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.85rem; }
    .content { padding: 2rem; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
    section { background: #fff; padding: 1.25rem 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 1.25rem; }
    section h2 { font-size: 1rem; margin-bottom: 0.75rem; }
    .row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.95rem; }
    .actions { display: flex; gap: 0.75rem; }
    button { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
    .primary { background: #2563eb; color: #fff; }
    .primary:hover { background: #1d4ed8; }
    .danger { background: #fff; color: #dc2626; border: 1px solid #fecaca; }
    .danger:hover { background: #fef2f2; }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="brand">Acme Console</span>
    <a href="/dashboard">Dashboard</a>
    <a href="/profile">Profile</a>
    <a href="/settings">Settings</a>
    <a href="/" data-testid="logout-link">Log out</a>
    <div class="user-avatar" data-testid="avatar">U</div>
  </nav>

  <div class="content">
    <h1 data-testid="settings-title">Settings</h1>

    <section>
      <h2 data-testid="section-notifications">Notifications</h2>
      <label class="row"><input type="checkbox" data-testid="toggle-email" checked> Email notifications</label>
      <label class="row"><input type="checkbox" data-testid="toggle-sms"> SMS notifications</label>
    </section>

    <section>
      <h2 data-testid="section-security">Privacy</h2>
      <label class="row"><input type="checkbox" data-testid="toggle-2fa"> Two-factor authentication</label>
    </section>

    <div class="actions">
      <button type="button" class="primary" data-testid="save-settings">Save settings</button>
      <button type="button" class="danger" data-testid="delete-account">Delete account</button>
    </div>
  </div>
</body>
</html>
